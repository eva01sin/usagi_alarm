plugins { id 'com.android.application' }

android {
    namespace 'com.usagi.alarm'
    compileSdk 35
    defaultConfig {
        applicationId 'com.usagi.alarm'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
        testInstrumentationRunner 'com.usagi.alarm.AlarmInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
